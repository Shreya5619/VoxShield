version: 1
frontend:
  baseDirectory: voxshield
  phases:
    preBuild:
      commands:
        - cd voxshield && npm install
    build:
      commands:
        - npx expo export --platform web
  artifacts:
    baseDirectory: voxshield/dist
    files:
      - '**/*'
  cache:
    paths:
      - voxshield/node_modules/**/*